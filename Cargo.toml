[package]
name = "geometry-wars"
version = "0.2.0"
edition = "2021"

[dependencies]
ordered-float = "5.1.0"
num = "0.4.3"
bevy = { version = "0.17", features = ["bevy_sprite", "wayland"] }
bevy_egui = "0.38.0"
avian2d = { version = "0.4", default-features = false, features = [
  "2d",
  "f64",
  "parry-f64",
  "debug-plugin",
] }
bevy_hanabi = { version = "0.17", default-features = false, features = ["2d"] }
bevy_tweening = "0.14"
strum = "0.27.2"
strum_macros = "0.27.2"
rand = "0.9.2"
rand_distr = "0.5.1"
rand_seeder = "0.4.0"
rand_pcg = "0.9.0"
# iyes_perf_ui = "0.5.0"
geo = "0.32.0"
bevy-inspector-egui = "0.35"
bevy-trait-query = "0.17"
hexx = "0.22.0"
# big-brain = "0.22.0"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

